<!-- books/templates/books/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Book Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% include 'books/navbar.html' %}

    <div class="container mt-4">
        <h1>Search for Your Favorite Book</h1>
        <form method="get" action="{% url 'search_books' %}" class="mb-4">
            <div class="input-group">
                <input type="text" name="q" class="form-control" placeholder="e.g., The Lord of the Rings" value="{{ query|default:'' }}">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>

        <div class="row">
            {% for book in books %}
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <img src="{{ book.cover_url }}" class="card-img-top" alt="Cover of {{ book.title }}" style="height: 300px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title">{{ book.title }}</h5>
                        <p class="card-text"><strong>Author:</strong> {{ book.author }}</p>
                        <p class="card-text"><small class="text-muted">Published: {{ book.published_date }}</small></p>
                    </div>
                    <div class="card-footer">
                        <!-- Form to save the book -->
                        <form action="{% url 'save_book' %}" method="post">
                            {% csrf_token %}
                            <input type="hidden" name="google_id" value="{{ book.google_id }}">
                            <input type="hidden" name="title" value="{{ book.title }}">
                            <input type="hidden" name="author" value="{{ book.author }}">
                            <input type="hidden" name="published_date" value="{{ book.published_date }}">
                            <input type="hidden" name="description" value="{{ book.description }}">
                            <input type="hidden" name="cover_url" value="{{ book.cover_url }}">
                            <button type="submit" class="btn btn-success w-100">Save to My Library</button>
                        </form>
                    </div>
                </div>
            </div>
            {% empty %}
                {% if query %}
                <p>No books found for "{{ query }}". Try another search.</p>
                {% endif %}
            {% endfor %}
        </div>
    </div>
</body>
</html>
